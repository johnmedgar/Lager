[project]
name = "lager"
version = "0.4.1"
description = "Record function, method and class call parameters to a YAML log via the logging library."
authors = [
  {name = "John Edgar", email = "edgarjohnmichael@gmail.com"},
]
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.urls]
Respository = "https://github.com/johnmedgar/Lager"
Issues = "https://github.com/johnmedgar/Lager/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
